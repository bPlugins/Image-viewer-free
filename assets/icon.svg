<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Image viewer with zoom magnifier">
  <title>All In One Image Viewer — zoom</title>
  <style>
    :root { --imv: 3.6s; }
    #imvA-lens { animation: imvA-move var(--imv) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #imvA-ring { animation: imvA-pulse var(--imv) ease-out infinite; transform-box: fill-box; transform-origin: center; }
    #imvA-photo { animation: imvA-zoom var(--imv) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes imvA-move {
      0%   { transform: translate(0px, 0px); }
      30%  { transform: translate(-26px, 14px); }
      65%  { transform: translate(22px, -10px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes imvA-pulse {
      0%   { transform: scale(.6); opacity: .0; }
      35%  { transform: scale(1); opacity: .5; }
      70%  { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes imvA-zoom {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      #imvA-lens, #imvA-ring, #imvA-photo { animation: none; }
      #imvA-ring { opacity: .35; }
    }
  </style>
  <defs>
    <linearGradient id="imvA-bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(0)">
      <stop offset="0" stop-color="#3cc27a"/>
      <stop offset="1" stop-color="#12a889"/>
    </linearGradient>
    <linearGradient id="imvA-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaf2"/>
      <stop offset="1" stop-color="#bff0dc"/>
    </linearGradient>
    <linearGradient id="imvA-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6f5ea"/>
    </linearGradient>
    <radialGradient id="imvA-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="imvA-tile"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
    <clipPath id="imvA-frame"><rect x="52" y="66" width="152" height="112" rx="14"/></clipPath>
    <clipPath id="imvA-lensclip"><circle cx="0" cy="0" r="27"/></clipPath>
  </defs>
  <g clip-path="url(#imvA-tile)">
    <rect x="0" y="0" width="256" height="256" fill="url(#imvA-bg)"/>
    <circle cx="60" cy="52" r="90" fill="#ffffff" opacity="0.08"/>
    <ellipse cx="128" cy="128" rx="120" ry="120" fill="url(#imvA-glow)" opacity="0.35"/>

    <!-- photo frame -->
    <rect x="48" y="62" width="160" height="120" rx="18" fill="#ffffff" opacity="0.96"/>
    <g clip-path="url(#imvA-frame)">
      <g id="imvA-photo">
        <rect x="52" y="66" width="152" height="112" fill="url(#imvA-sky)"/>
        <circle cx="86" cy="98" r="15" fill="#ffd36b"/>
        <path d="M52 178 L104 118 L138 158 L164 128 L204 178 Z" fill="#2fa878"/>
        <path d="M52 178 L138 158 L164 128 L204 178 Z" fill="#1f8f66"/>
      </g>
    </g>

    <!-- magnifier -->
    <g id="imvA-lens">
      <circle id="imvA-ring" cx="128" cy="120" r="33" fill="none" stroke="#ffffff" stroke-width="4"/>
      <g transform="translate(128,120)">
        <line x1="19" y1="19" x2="40" y2="40" stroke="#0e7a5e" stroke-width="11" stroke-linecap="round"/>
        <line x1="19" y1="19" x2="40" y2="40" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="31" fill="url(#imvA-glass)" opacity="0.45"/>
        <g clip-path="url(#imvA-lensclip)">
          <rect x="-27" y="-27" width="54" height="54" fill="url(#imvA-sky)"/>
          <path d="M-27 27 L-2 -6 L14 15 L27 -2 L27 27 Z" fill="#2fa878"/>
          <circle cx="-10" cy="-9" r="8" fill="#ffd36b"/>
        </g>
        <circle cx="0" cy="0" r="30" fill="none" stroke="#0e7a5e" stroke-width="6"/>
        <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
        <g stroke="#0e7a5e" stroke-width="4" stroke-linecap="round">
          <line x1="-8" y1="0" x2="8" y2="0"/>
          <line x1="0" y1="-8" x2="0" y2="8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
